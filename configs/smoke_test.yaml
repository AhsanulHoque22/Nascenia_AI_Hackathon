# Local CPU smoke test — validates the train.py pipeline runs end-to-end
# (tokenization, length filtering, prompt masking, LoRA wrapping, Trainer
# loop, checkpoint save, metrics.json) on a handful of examples. Not meant
# to produce a good model — see qwen3_full.yaml for the real run.
seed: 42

base_model: Qwen/Qwen2.5-0.5B-Instruct  # small + already cached locally
attn_implementation: eager  # sdpa needs no special support, but eager is safest on CPU

quantization:
  load_in_4bit: false  # no CUDA locally; would fall back anyway

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  train_path: data/processed/train_curated.jsonl
  val_path: data/processed/val.jsonl
  max_train_samples: 4
  max_eval_samples: 2
  min_prompt_tokens: 32
  tokenize_num_proc: 2

training:
  max_seq_len: 1152  # must exceed response length (~674 tok mean) or every row is dropped
  epochs: 1
  batch_size: 2
  eval_batch_size: 2
  grad_accum_steps: 1
  learning_rate: 0.0002
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 1
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 1
  gradient_checkpointing: false
  group_by_length: true
  optim: adamw_torch
  dataloader_num_workers: 0
