# The one-shot full fine-tune. Kaggle T4, single ~11h session.
#
# Every value below traces to a measurement or a cited ablation — see
# TRAINING_NOTES.md. The load-bearing decisions:
#
#   load_in_4bit: true    MEASURED, against the theory. The prediction was that
#                         dropping 4-bit buys 1.25-1.4x. The calibration probe
#                         (day10) measured 6.08s/step with 4-bit vs 6.24s/step
#                         without — no gain, marginally worse. And at seq 1152
#                         peak VRAM is 13.8GB of 14.56GB WITH gradient
#                         checkpointing, so the fp16 + no-checkpointing configs
#                         all OOM'd. The throughput analysis assumed seq 768;
#                         raising to 1152 inverts the memory picture.
#   max_seq_len: 1152     At 768, responses (mean 674 tokens) crowd the prompt
#                         down to ~64 tokens and 28.9% of rows lose the question
#                         entirely. 1152 costs +37%/example and cuts that to
#                         4.6%.
#   r: 32                 Bengali + medical register is a double distribution
#                         shift, the regime where adapter capacity binds. ~2-4%
#                         step cost. alpha=2r keeps the LR valid.
#   epochs: 1             At fixed compute, unique examples beat repeats, and a
#                         single pass has no epoch-2 overfitting cliff to fall
#                         off with no second attempt.
#   NO neftune            Its own paper (Fig. 5) shows it LOWERS ROUGE-L/BLEU
#                         vs ground truth. Every reported gain is LLM-judge
#                         win-rate. It optimizes the opposite of our metric.
#   NO rslora             Benefit is at r>=128; at r=32 it would silently jump
#                         the update scale 2.0 -> 11.3 and invalidate the LR.
seed: 42

base_model: Qwen/Qwen3-1.7B
attn_implementation: sdpa  # FlashAttention-2 needs sm_80+; T4 is sm_75

quantization:
  load_in_4bit: true   # measured: no throughput cost here, and the VRAM is needed

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  use_rslora: false

data:
  train_path: data/processed/train_curated.jsonl  # src/curate_train.py, 81,771 rows
  val_path: data/processed/val.jsonl
  max_train_samples: 24000  # measured capacity: 24,888 examples in 10.5h
  max_eval_samples: 200     # eval is for a loss curve, not the real metric
  min_prompt_tokens: 64     # drop rows whose response leaves less than this for the question
  tokenize_num_proc: 4

training:
  max_seq_len: 1152
  epochs: 1
  batch_size: 4
  eval_batch_size: 4
  grad_accum_steps: 4       # effective batch 16
  learning_rate: 0.0002
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  logging_steps: 25
  eval_strategy: steps
  eval_steps: 250
  save_strategy: steps
  save_steps: 250           # ~1500 total steps; frequent saves mean an OOM or a
                            # session timeout at hour 9 still leaves a usable model
  save_total_limit: 5
  gradient_checkpointing: true   # required: without it seq 1152 OOMs on a T4
  group_by_length: true
  optim: adamw_torch_fused
  dataloader_num_workers: 2
  use_liger_kernel: false   # probe: did not prevent the OOM at seq 1152
